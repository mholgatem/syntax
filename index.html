<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A fast, private, browser-based code editor with tabs, diff and syntax highlighting for Verilog, SystemVerilog, VHDL and 60+ languages." />
    <meta name="theme-color" content="#f3f3f3" />
    <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png" />
    <title>Syntax</title>
    <script>
      // Pick the initial chrome colors before CSS loads, to avoid a flash of the wrong theme.
      try {
        var s = JSON.parse(localStorage.getItem('syntax.settings.v1') || '{}');
        var dark = s.mode === 'dark' || ((!s.mode || s.mode === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app">
      <header id="menubar" aria-label="Main menu"></header>
      <div id="toolbar" role="toolbar" aria-label="Toolbar"></div>
      <div id="main-area">
        <main id="workspace">
          <div id="panes">
            <section class="pane" id="pane-0" aria-label="Left view">
              <nav class="tabbar" id="tabbar" aria-label="Open files"></nav>
              <div class="pane-body">
                <div class="editor-host" id="editor-host"></div>
                <section id="diff-pane" aria-label="Compare">
                  <div id="diff-toolbar"></div>
                  <div id="diff-host"></div>
                </section>
              </div>
            </section>
            <div id="pane-divider" role="separator" aria-orientation="vertical" aria-label="Resize views" title="Drag to resize"></div>
            <section class="pane" id="pane-1" aria-label="Right view">
              <nav class="tabbar" id="tabbar-2" aria-label="Open files (right view)"></nav>
              <div class="pane-body">
                <div class="editor-host" id="editor-host-2"></div>
              </div>
            </section>
          </div>
          <div id="welcome">
            <div class="welcome-card">
              <div class="welcome-icon codicon codicon-files" aria-hidden="true"></div>
              <h1>Drop files here to start</h1>
              <p>Drag files or whole folders anywhere onto this window. They open as tabs, and nothing is uploaded.</p>
              <div class="welcome-actions">
                <button id="welcome-open" class="primary">Open Files…</button>
                <button id="welcome-new">New File</button>
              </div>
              <p class="welcome-hint">Verilog · SystemVerilog · VHDL · Tcl/XDC · C/C++ · Python · JS/TS · Java · Go · Rust · and 50+ more</p>
            </div>
          </div>
        </main>
        <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize side panel"></div>
        <aside id="sidebar" aria-label="Side panel">
          <div class="sidebar-head" role="tablist">
            <button class="sidebar-tab" role="tab" data-tab="outline"><span class="codicon codicon-list-tree" aria-hidden="true"></span>Outline</button>
            <button class="sidebar-tab" role="tab" data-tab="search"><span class="codicon codicon-search" aria-hidden="true"></span>Search</button>
            <span class="sidebar-spacer"></span>
            <button class="sidebar-close codicon codicon-close" title="Close panel" aria-label="Close panel"></button>
          </div>
          <div class="sidebar-panel" id="outline-panel" data-tab="outline" role="tabpanel"></div>
          <div class="sidebar-panel" id="search-panel" data-tab="search" role="tabpanel"></div>
        </aside>
      </div>
      <footer id="statusbar"></footer>
    </div>
    <div id="drop-overlay"><div class="drop-message"><span class="codicon codicon-cloud-upload" aria-hidden="true"></span>Drop to open</div></div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <input type="file" id="file-input" multiple hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
